Defense:
    batch_size: 64
    learning_rate: 0.0001
    
    model_name: FEDformer
    dataset: PEMS03
    attack_save_folder: ./checkpoints/PEMS03_backtime_FEDformer_1212/

    token_len: 12
    seq_len: 12
    pred_len: 12
    label_len: 0

    alpha: 0.2 # intial clean rate
    beta: 0.5 # maximum clean rate
   
    t_b: 10 # Training epochs for backcaster in RCF
    t_1: 10 # Warming epochs for forecaster in Stage I
    t_2: 90 # Training epochs for forecaster in Stage II (default 1)

    k_nn: 20 # Neighboorhood size 
    pi: 1.25  # Scaling Ratio

    k_nn_max: 64 # maximum k for knn for neighboorhood distance cache, at least x2 (fast implementation)
